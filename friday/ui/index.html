<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIDAY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffb020'/%3E%3C/svg%3E">
<style>
:root{
  --bg: rgba(10,12,20,.94); --bg2: rgba(255,255,255,.04); --bg3: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.09); --text:#eef0f6; --dim:#9aa0b4; --faint:#636a80;
  --amber:#ffb020; --coral:#ff5e3a; --cyan:#4fd1ff; --green:#3ddc97; --red:#ff5468;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;color:var(--text);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text);user-select:text}
a{color:var(--cyan)}

/* ---------- panel ---------- */
#panel{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06)}
body.mini #panel{display:none}

header{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font-size:13px;letter-spacing:.32em;font-weight:700}
.brand span{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:.15s}
.icon:hover{background:var(--bg3);color:var(--text)}
.icon.on{color:var(--amber)}
.icon svg{width:16px;height:16px}

nav{display:flex;gap:4px;padding:0 12px 8px}
nav button{flex:1;padding:6px 0;border-radius:8px;color:var(--dim);font-size:12px;font-weight:500}
nav button.active{background:var(--bg3);color:var(--text)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 14px;user-select:text}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

/* ---------- orb ---------- */
.orb{position:relative;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff3d6 0%,var(--amber) 28%,var(--coral) 62%,#5a1a3a 100%);
  box-shadow:0 0 18px rgba(255,140,40,.55), inset 0 0 10px rgba(255,255,255,.35);
  animation:breathe 4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid transparent;
  border-top-color:rgba(255,190,90,.9);border-right-color:rgba(79,209,255,.5);opacity:0;transition:opacity .3s}
.orb.busy{animation:breathe 1.1s ease-in-out infinite}
.orb.busy::after{opacity:1;animation:spin .9s linear infinite}
.orb.paused{filter:grayscale(1) brightness(.7);animation:none}
.orb.watching::before{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(79,209,255,.55);animation:ping 3s ease-out infinite}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 28px rgba(255,140,40,.75), inset 0 0 12px rgba(255,255,255,.4)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
header .orb{width:30px;height:30px}
#bigorb{display:none;position:absolute;width:64px;height:64px;top:50%;left:50%;margin:-32px 0 0 -32px}
body.mini #bigorb{display:block;cursor:pointer}

/* ---------- chat ---------- */
.msg{margin:10px 0;display:flex}
.msg .b{max-width:88%;padding:8px 12px;border-radius:14px;word-wrap:break-word}
.msg.user{justify-content:flex-end}
.msg.user .b{background:linear-gradient(135deg,rgba(255,176,32,.22),rgba(255,94,58,.18));border:1px solid rgba(255,176,32,.25);border-bottom-right-radius:4px}
.msg.assistant .b{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:4px}
.b p{margin:.25em 0}.b ul,.b ol{margin:.3em 0 .3em 1.2em}
.b code{font:12px var(--mono);background:rgba(255,255,255,.08);padding:1px 4px;border-radius:4px}
.b pre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;margin:.4em 0}
.b pre code{background:none;padding:0}
.b h1,.b h2,.b h3{font-size:13px;margin:.5em 0 .2em}
.step{font:11px/1.4 var(--mono);color:var(--dim);margin:6px 0 6px 2px;padding:5px 8px;border-left:2px solid var(--amber);
  background:rgba(255,176,32,.05);border-radius:0 6px 6px 0;cursor:pointer;overflow:hidden}
.step .r{display:none;white-space:pre-wrap;color:var(--faint);margin-top:4px;max-height:160px;overflow:auto}
.step.open .r{display:block}
.step em{color:var(--faint);font-style:normal}
.notice{text-align:center;color:var(--dim);font-size:11px;margin:10px 0}
.confirm{margin:10px 0;padding:10px;border:1px solid rgba(255,176,32,.45);border-radius:12px;background:rgba(255,176,32,.07)}
.confirm .t{font-weight:600;margin-bottom:6px}
.confirm .small{word-break:break-all;margin-bottom:4px}
.confirm pre{font:11px var(--mono);white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto;
  background:rgba(0,0,0,.3);padding:6px 8px;border-radius:6px;margin-bottom:8px;color:#ffd9a0}
.confirm .row{display:flex;gap:8px}
.btn{padding:6px 12px;border-radius:8px;background:var(--bg3);font-weight:500;font-size:12px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--amber);color:#1a1205}
.btn.primary:hover{background:#ffc04d}
.btn.danger{color:var(--red)}
.confirm.done{opacity:.55}.confirm.done .row{display:none}
.typing{display:flex;gap:4px;padding:10px 12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{transform:translateY(-4px);background:var(--amber)}}

.hello{padding:26px 6px 6px;text-align:center}
.hello .orb{width:64px;height:64px;margin:0 auto 14px}
.hello h2{font-size:16px;font-weight:600;margin-bottom:4px}
.hello p{color:var(--dim);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:12px;background:var(--bg2)}
.chip:hover{color:var(--text);border-color:rgba(255,176,32,.5)}

.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:36px;padding:8px 12px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--line);outline:none}
.composer textarea:focus{border-color:rgba(255,176,32,.5)}
.send{width:36px;height:36px;border-radius:12px;background:var(--amber);color:#1a1205;display:grid;place-items:center;flex:none}
.send svg{width:16px;height:16px}

/* ---------- memory & brains ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{color:var(--dim);font-size:11px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.card h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center}
.fact{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line)}
.fact:first-of-type{border-top:0}
.fact span{flex:1}.fact small{color:var(--faint)}
.fact button{color:var(--faint);font-size:14px;line-height:1;padding:0 4px;opacity:0}
.fact:hover button{opacity:1}.fact button:hover{color:var(--red)}
.cat{color:var(--amber);font-size:11px;margin-top:8px;text-transform:capitalize}
.tl{padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.tl:first-of-type{border-top:0}
.tl b{color:var(--dim);font-weight:500;font-family:var(--mono);font-size:11px;margin-right:4px}
.empty{color:var(--faint);font-size:12px;padding:4px 0}
.prov{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prov .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prov .top b{flex:1;text-transform:capitalize}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}.dot.warn{background:var(--amber)}.dot.err{background:var(--red)}
.field{display:flex;align-items:center;gap:6px;margin:4px 0}
.field label{width:54px;color:var(--faint);font-size:11px}
.field input{flex:1;min-width:0;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.25);border:1px solid var(--line);outline:none;font-size:12px}
.field input:focus{border-color:rgba(255,176,32,.5)}
.err{color:var(--red);font-size:11px;margin-top:4px;word-break:break-word}
.hint{color:var(--dim);font-size:12px;margin:2px 0 10px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.sw{width:34px;height:20px;border-radius:10px;background:var(--bg3);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--amber)}.sw.on::after{left:16px}
.small{font-size:11px;color:var(--faint)}
</style>
</head>
<body>
<div id="bigorb" class="orb pywebview-drag-region" title="Click to open FRIDAY"></div>

<div id="panel">
  <header class="pywebview-drag-region">
    <div class="orb" id="orb"></div>
    <div class="brand"><b>FRIDAY</b><span id="sub">Connecting…</span></div>
    <button class="icon" id="tWatch" title="Watch my screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="icon" id="tSpeak" title="Speak replies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    <button class="icon" id="bMin" title="Shrink to orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <button class="icon" id="bQuit" title="Quit FRIDAY"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <nav>
    <button data-v="chat" class="active">Chat</button>
    <button data-v="memory">Memory</button>
    <button data-v="brains">Brains</button>
  </nav>

  <section class="view active" id="v-chat">
    <div class="scroll" id="log">
      <div class="hello" id="hello">
        <div class="orb"></div>
        <h2>Hi, I'm FRIDAY.</h2>
        <p>I watch, learn and get things done for you.</p>
        <div class="chips">
          <button class="chip">What am I working on?</button>
          <button class="chip">Look at my screen and help</button>
          <button class="chip">Summarize my day</button>
          <button class="chip">What do you know about me?</button>
          <button class="chip">Remind me to stretch in 30 min</button>
        </div>
      </div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask FRIDAY or give a task…"></textarea>
      <button class="send" id="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <section class="view" id="v-memory"><div class="scroll" id="mem"></div></section>
  <section class="view" id="v-brains"><div class="scroll" id="brains"></div></section>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let ws, state = {}, typingEl = null;
const hasNative = () => window.pywebview && window.pywebview.api;

/* ---------- markdown (small, safe) ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(src){
  const blocks=[]; let s=esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`});
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>')
     .replace(/^#{1,3} (.*)$/gm,'<h3>$1</h3>');
  const out=[]; let list=null;
  for(const line of s.split('\n')){
    const m=line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(m){ if(!list){list=/^\s*\d/.test(line)?'ol':'ul'; out.push(`<${list}>`)} out.push(`<li>${m[1]}</li>`); continue }
    if(list){out.push(`</${list}>`);list=null}
    if(line.trim()) out.push(line.startsWith('<h3>')||line.includes('\u0000')?line:`<p>${line}</p>`);
  }
  if(list) out.push(`</${list}>`);
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre><code>${blocks[i]}</code></pre>`);
}

/* ---------- chat rendering ---------- */
function scrollDown(){log.scrollTop = log.scrollHeight}
function hideHello(){const h=$('#hello'); if(h) h.remove()}
function addMsg(role, text){
  hideHello();
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML=`<div class="b">${role==='user'?esc(text).replace(/\n/g,'<br>'):md(text)}</div>`;
  log.insertBefore(d, typingEl && typingEl.isConnected ? typingEl : null); scrollDown();
}
function showTyping(on){
  if(on && !(typingEl && typingEl.isConnected)){
    typingEl=document.createElement('div'); typingEl.className='msg assistant';
    typingEl.innerHTML='<div class="b typing"><i></i><i></i><i></i></div>'; log.appendChild(typingEl); scrollDown();
  } else if(!on && typingEl){ typingEl.remove(); typingEl=null }
}
function addStep(m){
  hideHello();
  const d=document.createElement('div'); d.className='step';
  const a=JSON.stringify(m.args);
  d.innerHTML=`⚙ ${esc(m.tool)} <em>${esc(a.length>90?a.slice(0,90)+'…':a)}</em>${m.brain?` <em>· ${esc(m.brain)}</em>`:''}<div class="r"></div>`;
  d.onclick=()=>d.classList.toggle('open');
  d.dataset.tool=m.tool;
  log.insertBefore(d, typingEl && typingEl.isConnected ? typingEl : null); scrollDown();
}
function stepResult(m){
  const steps=[...log.querySelectorAll('.step')].reverse(); const s=steps.find(x=>x.dataset.tool===m.tool && !x.dataset.done);
  if(s){s.dataset.done=1; s.querySelector('.r').textContent=m.result}
}
function addNotice(t){const d=document.createElement('div');d.className='notice';d.textContent=t;log.appendChild(d);scrollDown()}
function addConfirm(m){
  hideHello();
  const d=document.createElement('div'); d.className='confirm'; d.id='c'+m.id;
  const body = m.args.command || m.args.script || m.args.text || m.args.content || JSON.stringify(m.args,null,2);
  d.innerHTML=`<div class="t">FRIDAY wants to run <code>${esc(m.tool)}</code></div>
    ${m.args.path?`<div class="small">${esc(m.args.path)}</div>`:''}<pre>${esc(body)}</pre>
    <div class="row"><button class="btn primary">Allow</button><button class="btn danger">Deny</button></div>`;
  const [ok,no]=d.querySelectorAll('button');
  const done=(v)=>{send({type:'confirm',id:m.id,ok:v}); d.classList.add('done'); d.querySelector('.t').textContent=(v?'✓ Allowed ':'✕ Denied ')+m.tool};
  ok.onclick=()=>done(true); no.onclick=()=>done(false);
  log.insertBefore(d, typingEl && typingEl.isConnected ? typingEl : null); scrollDown();
  if(document.body.classList.contains('mini')) setMode('panel');
}

/* ---------- status ---------- */
const WATCH_LABEL={watching:'Watching',idle:'You seem away',paused:'Not watching',private:'Private app — eyes closed',
  'no-permission':'Needs Screen Recording permission',off:'Not watching',starting:'Starting'};
function applyStatus(s){
  state=s; const w=s.watcher||{};
  let sub = s.busy ? `${s.busy_label||'Thinking'}…` : (WATCH_LABEL[w.state]||'Online') + (w.state==='watching'&&w.app?` · ${w.app}`:'');
  $('#sub').textContent = sub; $('#sub').title = w.description||'';
  for(const o of document.querySelectorAll('.orb')){
    o.classList.toggle('busy',!!s.busy); o.classList.toggle('watching',w.state==='watching'&&!s.busy);
    o.classList.toggle('paused',!s.busy && ['paused','off'].includes(w.state));
  }
  $('#tWatch').classList.toggle('on', s.toggles.watch); $('#tSpeak').classList.toggle('on', s.toggles.speak);
  showTyping(!!s.busy);
}

/* ---------- socket ---------- */
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)) }
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.type){
      case 'status': applyStatus(m); break;
      case 'history': if(m.messages.length){ log.innerHTML=''; m.messages.forEach(x=>addMsg(x.role,x.text)) } break;
      case 'reply': showTyping(false); addMsg('assistant', m.text); break;
      case 'step': addStep(m); break;
      case 'step_result': stepResult(m); break;
      case 'confirm': addConfirm(m); break;
      case 'confirm_expired': { const c=$('#c'+m.id); if(c){c.classList.add('done'); c.querySelector('.t').textContent='⌛ Expired'} } break;
      case 'notice': addNotice(m.text); break;
      case 'profile': if($('#v-memory').classList.contains('active')) loadMemory(); break;
    }
  };
  ws.onclose=()=>{ $('#sub').textContent='Reconnecting…'; setTimeout(connect,1500) };
}

/* ---------- input ---------- */
const input=$('#input');
function submit(text){
  text=(text??input.value).trim(); if(!text) return;
  addMsg('user',text); send({type:'chat',text}); input.value=''; input.style.height='';
  showTyping(true);
}
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()} });
input.addEventListener('input',()=>{input.style.height='';input.style.height=Math.min(input.scrollHeight,120)+'px'});
$('#send').onclick=()=>submit();
log.addEventListener('click',e=>{ if(e.target.classList.contains('chip')) submit(e.target.textContent) });

/* ---------- header buttons ---------- */
async function toggle(key){
  const r=await fetch('/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key,value:!state.toggles[key]})}); applyStatus(await r.json());
}
$('#tWatch').onclick=()=>toggle('watch');
$('#tSpeak').onclick=()=>{ if(state.toggles.speak) send({type:'stop_speaking'}); toggle('speak') };
function setMode(mode){
  document.body.classList.toggle('mini', mode==='orb');
  if(hasNative()) window.pywebview.api.set_mode(mode);
  if(mode==='panel') setTimeout(()=>input.focus(),100);
}
$('#bMin').onclick=()=>setMode('orb');
$('#bQuit').onclick=()=>{ if(confirm('Quit FRIDAY?')) hasNative()? window.pywebview.api.quit() : window.close() };
let downAt=null;
$('#bigorb').addEventListener('mousedown',e=>downAt=[e.screenX,e.screenY]);
$('#bigorb').addEventListener('mouseup',e=>{
  if(downAt && Math.hypot(e.screenX-downAt[0],e.screenY-downAt[1])<5) setMode('panel'); downAt=null;
});
if(!hasNative()) { window.addEventListener('pywebviewready',()=>{}); }

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='memory') loadMemory();
  if(b.dataset.v==='brains') loadBrains();
});

/* ---------- memory tab ---------- */
const hhmm = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
async function loadMemory(){
  const m=await (await fetch('/api/memory')).json(); const el=$('#mem');
  const groups={}; m.facts.forEach(f=>(groups[f.category]=groups[f.category]||[]).push(f));
  el.innerHTML=`
    <div class="stats">
      <div class="stat"><b>${m.stats.facts}</b><span>things learned</span></div>
      <div class="stat"><b>${m.stats.days}</b><span>days observed</span></div>
      <div class="stat"><b>${m.stats.activity}</b><span>moments seen</span></div>
    </div>
    <div class="card"><h3>Who you are <button class="btn" id="learnNow">Learn now</button></h3>
      ${m.profile?`<div class="b">${md(m.profile)}</div>`:'<div class="empty">Still getting to know you. Keep working — I learn every hour, or press “Learn now”.</div>'}</div>
    ${m.reminders.length?`<div class="card"><h3>Reminders</h3>${m.reminders.map(r=>`<div class="tl"><b>${hhmm(r.due)}</b>${esc(r.text)}</div>`).join('')}</div>`:''}
    <div class="card"><h3>What I know</h3>
      ${Object.keys(groups).length?Object.entries(groups).map(([c,fs])=>`<div class="cat">${esc(c)}</div>`+
        fs.map(f=>`<div class="fact"><span>${esc(f.text)}</span>${f.strength>1?`<small>×${f.strength}</small>`:''}<button data-id="${f.id}" title="Forget this">×</button></div>`).join('')).join('')
        :'<div class="empty">Nothing yet.</div>'}</div>
    <div class="card"><h3>Today</h3>
      ${m.today.length?m.today.slice().reverse().map(a=>`<div class="tl"><b>${hhmm(a.ts)}</b>${esc(a.description)}</div>`).join('')
        :'<div class="empty">No screen activity observed today.</div>'}</div>
    ${m.notes.length?`<div class="card"><h3>Journal</h3>${m.notes.slice().reverse().map(n=>`<div class="tl"><b>${n.kind==='daily'?'day':hhmm(n.ts)}</b>${esc(n.text)}</div>`).join('')}</div>`:''}`;
  el.querySelectorAll('.fact button').forEach(b=>b.onclick=async()=>{await fetch('/api/facts/'+b.dataset.id,{method:'DELETE'}); b.parentElement.remove()});
  $('#learnNow').onclick=async e=>{ e.target.textContent='Learning…'; e.target.disabled=true;
    try{ await fetch('/api/learn',{method:'POST'}) } finally { loadMemory() } };
}

/* ---------- brains tab ---------- */
const KEY_LINKS={GEMINI_API_KEY:['aistudio.google.com/apikey','free'],GROQ_API_KEY:['console.groq.com/keys','free'],
  OPENROUTER_API_KEY:['openrouter.ai/keys','free models'],OPENAI_API_KEY:['platform.openai.com/api-keys','paid']};
async function loadBrains(){
  const s=await (await fetch('/api/settings')).json(); const el=$('#brains');
  el.innerHTML=`<p class="hint">FRIDAY tries brains in order and falls back automatically. Ollama runs locally — free and private.
     Your screen is only seen by: <b>${esc(s.chains.screen_vision.join(', '))}</b>.</p>
    <div class="card"><h3>Behaviour</h3>
      <div class="toggle"><span>Ask before risky actions</span><button class="sw ${state.toggles.confirm?'on':''}" data-k="confirm"></button></div>
      <div class="toggle"><span>Speak replies out loud</span><button class="sw ${state.toggles.speak?'on':''}" data-k="speak"></button></div>
      <div class="toggle"><span>Watch &amp; learn from my screen</span><button class="sw ${state.toggles.watch?'on':''}" data-k="watch"></button></div>
    </div>
    <div class="small" style="margin-bottom:8px">Chat order: ${esc(s.chains.chat.join(' → '))}</div>
    ${s.providers.map(p=>{
      const cls=!p.configured?'':p.last_error?'err':p.cooling?'warn':'ok'; const link=KEY_LINKS[p.key_env];
      return `<div class="prov" data-name="${p.name}"><div class="top"><span class="dot ${cls}"></span><b>${p.name}</b>
        ${link?`<a class="small" href="https://${link[0]}" target="_blank">get key (${link[1]})</a>`:'<span class="small">local · free</span>'}
        <button class="btn test">Test</button></div>
        ${p.key_env?`<div class="field"><label>API key</label><input type="password" data-key="${p.key_env}" placeholder="${p.configured?'•••••• saved':'paste key'}"></div>`:''}
        <div class="field"><label>Model</label><input data-f="model" value="${esc(p.model||'')}"></div>
        <div class="field"><label>Vision</label><input data-f="vision_model" value="${esc(p.vision_model||'')}" placeholder="none"></div>
        <div class="msgline">${p.last_error?`<div class="err">${esc(p.last_error)}</div>`:''}</div></div>`}).join('')}
    <button class="btn primary" id="saveBrains" style="width:100%;padding:9px;margin-top:4px">Save</button>`;
  el.querySelectorAll('.sw').forEach(b=>b.onclick=async()=>{await toggle(b.dataset.k); b.classList.toggle('on',state.toggles[b.dataset.k])});
  el.querySelectorAll('.test').forEach(b=>b.onclick=async()=>{
    const card=b.closest('.prov'); b.textContent='…';
    const r=await (await fetch('/api/test_brain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:card.dataset.name})})).json();
    b.textContent='Test'; card.querySelector('.msgline').innerHTML=r.ok?`<div class="small" style="color:var(--green)">✓ ${esc(r.text)}</div>`:`<div class="err">${esc(r.error)}</div>`;
    card.querySelector('.dot').className='dot '+(r.ok?'ok':'err');
  });
  $('#saveBrains').onclick=async e=>{
    const keys={}, models={};
    el.querySelectorAll('input[data-key]').forEach(i=>{ if(i.value.trim()) keys[i.dataset.key]=i.value.trim() });
    el.querySelectorAll('.prov').forEach(c=>{ models[c.dataset.name]={};
      c.querySelectorAll('input[data-f]').forEach(i=>models[c.dataset.name][i.dataset.f]=i.value.trim()||null) });
    e.target.textContent='Saving…';
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys,models})});
    loadBrains();
  };
}

connect();
input.focus();
</script>
</body>
